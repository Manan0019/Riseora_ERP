name: Riseora ERP Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout Riseora ERP
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Synchronize and validate application version
        id: version
        shell: pwsh
        run: |
          node scripts/version.mjs
          if ($LASTEXITCODE -ne 0) { throw "Version synchronization failed" }
          node scripts/version.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "Version validation failed" }
          $version = node scripts/version.mjs --print
          if ($LASTEXITCODE -ne 0) { throw "Unable to read version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          node --test scripts/version.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Version tests failed" }

      - name: Test shared v1.1.5 utilities and audit schema
        run: node --test scripts/pro115.test.mjs scripts/pro115-management.test.mjs scripts/pro115-inventory.test.mjs scripts/pro115-shared.test.mjs

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run business regression tests
        working-directory: server
        run: npm run test:regression

      - name: Test owner corrections (isolated database)
        working-directory: server
        run: npm run test:v114

      - name: Test v1.1.5 features (isolated database)
        working-directory: server
        run: npm run test:v115

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit installed runtime dependency trees
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dependency-audit | Out-Null
          $root = (Get-Location).Path
          foreach ($package in @('server','client','desktop')) {
            Push-Location $package
            try {
              npm audit --omit=dev --json | Out-File -Encoding utf8 "$root/dependency-audit/$package.json"
              $auditExit = $LASTEXITCODE
              if ($auditExit -ne 0) { Write-Warning "Audit for $package returned $auditExit. Review its JSON report before owner delivery." }
            } finally { Pop-Location }
          }
          exit 0

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Riseora-ERP-Dependency-Audit-${{ github.run_number }}
          path: dependency-audit/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Windows setup EXE
        working-directory: desktop
        run: npm run build:win

      - name: Verify output and print SHA256
        shell: pwsh
        run: |
          $version = node scripts/version.mjs --print
          if ($LASTEXITCODE -ne 0) { throw "Unable to read version" }
          $installer = "desktop/release/Riseora-ERP-Setup-$version.exe"
          node scripts/version.mjs --verify-installer $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer version verification failed" }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Riseora-ERP-Windows-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: desktop/release/Riseora-ERP-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7
